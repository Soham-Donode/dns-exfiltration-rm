# =====================================================================
# DNS Exfiltration Detection Configuration
# =====================================================================

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  models_dir: "models"
  tranco_url: "https://tranco-list.eu/top-1m.csv.zip"
  tranco_file: "data/raw/top-1m.csv"
  cic_bell_dir: "data/raw/cic_bell"
  labeled_traffic_csv: "data/processed/labeled_traffic.csv"
  features_dataset_csv: "data/processed/dns_features.csv"
  model_output_path: "models/dns_exfil_detector.joblib"
  benchmark_report_path: "models/benchmark_report.json"

simulation:
  target_domain: "tunnel.example.com"
  dns_server: "127.0.0.1"
  dns_port: 53
  query_types:
    - "A"
    - "TXT"
    - "AAAA"
    - "CNAME"
  encodings:
    - "base32"
    - "hex"
    - "base64"
  max_subdomain_label_len: 63
  burst_profile:
    delay_seconds: 0.02
    jitter_range: [0.0, 0.01]
  low_and_slow_profile:
    delay_seconds: 5.0
    jitter_range: [1.0, 3.0]

capture:
  interface: "lo"
  bpf_filter: "udp port 53"
  packet_count: 100
  timeout_seconds: 30
  tcpdump_bin: "tcpdump"
  output_pcap: "data/raw/live_capture.pcap"
  synthetic_pcap: "data/raw/synthesized_traffic.pcap"

features:
  calculate_entropy: true
  calculate_ratios: true
  calculate_frequencies: true
  frequency_window: "60s"
  ngram_range: [2, 3]

training:
  algorithm: "random_forest"  # Options: decision_tree, random_forest, xgboost
  test_size: 0.2
  random_state: 42
  cross_validation_folds: 5
  hyperparameters:
    decision_tree:
      criterion: "gini"
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
    random_forest:
      n_estimators: 100
      max_depth: 15
      min_samples_split: 5
      min_samples_leaf: 2
      n_jobs: -1
    xgboost:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      eval_metric: "logloss"
  tuning_grids:
    decision_tree:
      max_depth: [5, 10, 15, null]
      min_samples_split: [2, 5, 10]
      min_samples_leaf: [1, 2, 4]
    random_forest:
      n_estimators: [50, 100, 150]
      max_depth: [8, 15, 20]
      min_samples_split: [2, 5]
    xgboost:
      n_estimators: [50, 100]
      max_depth: [4, 6, 8]
      learning_rate: [0.05, 0.1, 0.2]
